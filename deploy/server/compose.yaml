# Single TS product; an operator supplies private HTTPS and mTLS Temporal configuration.
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: ${OPENBOT_POSTGRES_PASSWORD:?set OPENBOT_POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U openbot -d openbot]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - product-postgres:/var/lib/postgresql/data
  server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
      target: runtime-product
    stop_grace_period: 20s
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENBOT_TS_DATABASE_URL: postgres://openbot:${OPENBOT_POSTGRES_PASSWORD:?set OPENBOT_POSTGRES_PASSWORD}@postgres:5432/openbot
      OPENBOT_TS_OWNER_PASSWORD: ${OPENBOT_OWNER_PASSWORD:?set OPENBOT_OWNER_PASSWORD}
      OPENBOT_OWNER_NAME: ${OPENBOT_OWNER_NAME:-Owner}
      OPENBOT_TS_PUBLIC_ORIGIN: ${OPENBOT_TS_PUBLIC_ORIGIN:?set the HTTPS public origin}
      OPENBOT_TS_SESSION_TTL_HOURS: ${OPENBOT_TS_SESSION_TTL_HOURS:-12}
      OPENBOT_TS_TLS_CERT_PATH: /run/openbot/server.pem
      OPENBOT_TS_TLS_KEY_PATH: /run/openbot/server.key
      OPENBOT_TS_HEALTH_CA_PATH: /run/openbot/server-ca.pem
      OPENBOT_CONTROL_TEMPORAL_CONFIG_PATH: /run/openbot/temporal.json
    ports:
      - 127.0.0.1:3001:3001
    volumes:
      - product-state:/var/lib/openbot
      - ${OPENBOT_PRODUCT_CONFIG_DIRECTORY:?set a private UID-1000 configuration directory}:/run/openbot:ro
volumes:
  product-postgres:
  product-state:
