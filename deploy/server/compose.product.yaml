# Explicit standalone candidate: do not merge into old data-bearing Compose projects.
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: ${OPENBOT_POSTGRES_PASSWORD:?set OPENBOT_POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U openbot -d openbot]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - product-postgres:/var/lib/postgresql/data
  server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile.product
      target: runtime-product
    stop_grace_period: 20s
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENBOT_CONTROL_DATABASE_URL: postgres://openbot:${OPENBOT_POSTGRES_PASSWORD:?set OPENBOT_POSTGRES_PASSWORD}@postgres:5432/openbot
      OPENBOT_CONTROL_OWNER_PASSWORD: ${OPENBOT_OWNER_PASSWORD:?set OPENBOT_OWNER_PASSWORD}
      OPENBOT_OWNER_NAME: ${OPENBOT_OWNER_NAME:-Owner}
      OPENBOT_CONTROL_COOKIE_MODE: ${OPENBOT_CONTROL_COOKIE_MODE:-loopback}
      OPENBOT_CONTROL_ALLOWED_ORIGINS: ${OPENBOT_CONTROL_ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      OPENBOT_CONTROL_SESSION_TTL_HOURS: ${OPENBOT_CONTROL_SESSION_TTL_HOURS:-12}
    ports:
      - 127.0.0.1:3001:3001
    volumes:
      - product-state:/var/lib/openbot
volumes:
  product-postgres:
  product-state:
