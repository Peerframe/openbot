<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bot 头像</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span style="display: block; width: {{size}}px; height: {{size}}px; flex-shrink: 0">
<sc-if value="{{isRound}}" hint-placeholder-val="{{true}}">
<svg viewBox="0 0 96 96" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block"><path d="m39 30-4-10" fill="none" stroke="{{body}}" stroke-width="{{antennaWidth}}" stroke-linecap="round"></path><circle cx="33" cy="16" r="4.3" fill="{{body}}"></circle><path d="M12 61C12 41 27 26 47 26C68 26 83 41 83 61V71C83 83 69 89 48 89C26 89 12 83 12 71Z" fill="{{body}}"></path><path d="M12 69C29 76 66 76 83 69V72C83 83 69 89 48 89C26 89 12 83 12 72Z" fill="{{accent}}"></path><rect x="{{roundEyeL}}" y="{{roundEyeY}}" width="{{eyeW}}" height="{{roundEyeH}}" rx="{{eyeR}}" fill="{{eye}}"></rect><rect x="{{roundEyeR}}" y="{{roundEyeY2}}" width="{{eyeW}}" height="{{roundEyeH}}" rx="{{eyeR}}" fill="{{eye}}"></rect></svg>
</sc-if>
<sc-if value="{{isRelay}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 96 96" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block"><rect x="6" y="44" width="13" height="25" rx="6.5" fill="{{body}}"></rect><rect x="77" y="44" width="13" height="25" rx="6.5" fill="{{body}}"></rect><path d="M11 52v9m74-9v9" stroke="{{accent}}" stroke-width="4" stroke-linecap="round"></path><path d="M17 45C17 33 25 26 38 26H58C71 26 79 33 79 45V72C79 83 69 88 48 88C27 88 17 83 17 72Z" fill="{{body}}"></path><path d="M17 70C33 74 63 74 79 70V73C79 83 68 88 48 88C28 88 17 83 17 73Z" fill="{{accent}}"></path><rect x="{{relayEyeL}}" y="{{relayEyeY}}" width="{{eyeW}}" height="{{relayEyeH}}" rx="{{eyeR}}" fill="{{eye}}"></rect><rect x="{{relayEyeR}}" y="{{relayEyeY}}" width="{{eyeW}}" height="{{relayEyeH}}" rx="{{eyeR}}" fill="{{eye}}"></rect></svg>
</sc-if>
<sc-if value="{{isScout}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 96 96" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block"><path d="M14 61L17 22C17 18 20 17 23 20L36 32C43 30 53 30 60 32L73 20C76 17 79 18 79 22L82 61V72C82 83 68 89 48 89C28 89 14 83 14 72Z" fill="{{body}}"></path><path d="M14 70C29 76 67 76 82 70V73C82 83 68 89 48 89C28 89 14 83 14 73Z" fill="{{accent}}"></path><rect x="{{scoutEyeL}}" y="{{scoutEyeY}}" width="{{eyeW}}" height="{{scoutEyeH}}" rx="{{eyeR}}" fill="{{eye}}"></rect><rect x="{{scoutEyeR}}" y="{{scoutEyeY2}}" width="{{eyeW}}" height="{{scoutEyeH2}}" rx="{{eyeR}}" fill="{{eye}}" transform="{{scoutTilt}}"></rect></svg>
</sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"character":{"editor":"enum","options":["round","relay","scout"],"default":"round"},"accent":{"editor":"enum","options":["green","blue","yellow","red"],"default":"green"},"size":{"editor":"int","min":16,"max":160,"default":96},"surface":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const character = this.props.character ?? 'round';
    const size = Number(this.props.size ?? 96);
    const dark = (this.props.surface ?? 'light') === 'dark';
    // nft_like v2: light surface = charcoal head, dark surface = warm ivory head.
    const accents = {
      light: { green: '#91CF4B', blue: '#5F7CDE', yellow: '#DFAD4F', red: '#E0785C' },
      dark: { green: '#ADF16A', blue: '#92ACFF', yellow: '#F2C777', red: '#F59C82' }
    };
    const accent = accents[dark ? 'dark' : 'light'][this.props.accent ?? 'green'] ?? '#91CF4B';
    // Below 32px use the micro optical size: larger eyes, heavier antenna.
    const micro = size < 32;
    return {
      size,
      isRound: character === 'round',
      isRelay: character === 'relay',
      isScout: character === 'scout',
      body: dark ? '#E8EBDD' : '#20251F',
      eye: dark ? '#20251F' : '#FAFBF7',
      accent,
      antennaWidth: micro ? 6 : 4,
      eyeW: micro ? 12 : 10,
      eyeR: micro ? 6 : 5,
      roundEyeL: micro ? 28 : 29, roundEyeR: micro ? 54 : 55,
      roundEyeY: micro ? 43 : 44, roundEyeY2: 43, roundEyeH: micro ? 21 : 19,
      relayEyeL: micro ? 30 : 31, relayEyeR: micro ? 54 : 55,
      relayEyeY: micro ? 44 : 46, relayEyeH: micro ? 20 : 16,
      scoutEyeL: micro ? 28 : 29, scoutEyeR: micro ? 54 : 55,
      scoutEyeY: micro ? 46 : 47, scoutEyeH: micro ? 19 : 18,
      scoutEyeY2: micro ? 42 : 43, scoutEyeH2: micro ? 20 : 19,
      scoutTilt: micro ? '' : 'rotate(-9 60 52.5)'
    };
  }
}
</script>
</body>
</html>
