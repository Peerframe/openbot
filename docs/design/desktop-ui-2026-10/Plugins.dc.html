<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>插件</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;color:#1d1d1f;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.pill{height:34px;padding:0 16px;border-radius:17px;border:0;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #ffffff; display: grid; grid-template-columns: 300px minmax(0, 1fr)">
<dc-import name="Sidebar" active="plugins" hint-size="300px,900px"></dc-import>
<div style="background: #fcfcfc"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(0,0,0,0.34)"></div>

<div role="dialog" aria-modal="true" aria-label="插件" style="position: absolute; left: 170px; top: 60px; width: 1100px; height: 780px; box-sizing: border-box; border-radius: 22px; background: #fdfdfd; box-shadow: 0 30px 80px rgba(0,0,0,0.25); padding: 36px 48px 0; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
<button type="button" aria-label="关闭插件" style="position: absolute; right: 22px; top: 22px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; display: inline-grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>

<div style="display: flex; align-items: center; justify-content: space-between; padding-right: 56px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700">插件</h1>
<button type="button" style="display: inline-flex; align-items: center; gap: 10px; border: 0; background: transparent; cursor: pointer; font-size: 14px; color: #6e6e73">
<span style="display: flex">
<sc-for list="{{installed}}" as="p" hint-placeholder-count="4">
<span style="width: 28px; height: 28px; margin-left: -6px; border-radius: 8px; background: {{p.bg}}; color: {{p.fg}}; border: 2px solid #fdfdfd; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center">{{p.letter}}</span>
</sc-for>
</span>已安装 6 个<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6e6e73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
</div>

<label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px; border-radius: 23px; background: #f0f0f2; border: 1px solid #e7e7e9">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
<input type="search" placeholder="搜索插件" aria-label="搜索插件" style="border: 0; background: transparent; outline: none; font: inherit; font-size: 16px; width: 100%">
</label>

<div role="tablist" aria-label="分类" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
<button type="button" role="tab" aria-selected="{{c.on}}" class="pill" style="background: {{c.bg}}; color: {{c.fg}}; font-weight: {{c.weight}}">{{c.label}}</button>
</sc-for>
</div>

<div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 26px; padding-bottom: 28px">
<section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">我的插件</h2>
<span style="font-size: 14px; color: #8e8e93">给哪个 Bot 用，在这里决定</span>
</div>
<div style="border-radius: 18px; background: #f0f0f2; padding: 0 20px">
<sc-for list="{{mine}}" as="m" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 48px minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 14px 0; border-top: {{m.divider}}">
<span style="width: 48px; height: 48px; border-radius: 13px; background: {{m.bg}}; color: {{m.fg}}; border: 1px solid #e3e3e6; box-sizing: border-box; font-size: 18px; font-weight: 700; display: inline-grid; place-items: center">{{m.letter}}</span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 16px; font-weight: 600">{{m.name}}</span>
<span style="font-size: 13px; color: #6e6e73">{{m.use}}</span>
</span>
<span style="display: flex">
<sc-for list="{{m.bots}}" as="b" hint-placeholder-count="2">
<span title="{{b.name}}" style="width: 26px; height: 26px; margin-left: -6px; border-radius: 8px; background: {{b.color}}; border: 2px solid #f0f0f2; display: block"></span>
</sc-for>
</span>
<button type="button" class="pill" style="background: #ffffff; border: 1px solid #e3e3e6">选择 Bot</button>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">精选</h2>
<span style="font-size: 14px; color: #8e8e93">查看全部</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; row-gap: 10px">
<sc-for list="{{featured}}" as="f" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 8px 0">
<span style="width: 56px; height: 56px; border-radius: 15px; background: {{f.bg}}; color: {{f.fg}}; border: 1px solid #e3e3e6; box-sizing: border-box; font-size: 20px; font-weight: 700; display: inline-grid; place-items: center">{{f.letter}}</span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 16px; font-weight: 600">{{f.name}}</span>
<span style="font-size: 14px; color: #6e6e73; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.desc}}</span>
</span>
<sc-if value="{{f.added}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #6e6e73; padding: 0 8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1c7c3c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12 10 17 19 8"></polyline></svg>已添加</span></sc-if>
<sc-if value="{{f.notAdded}}" hint-placeholder-val="{{true}}"><button type="button" class="pill" style="background: #ececee">添加</button></sc-if>
</div>
</sc-for>
</div>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const tile = (letter, fg) => ({ letter, fg, bg: '#ffffff' });
    const bot = (name, color) => ({ name, color });
    const research = bot('研究助理', '#8b7cf6');
    const cs = bot('客服小橙', '#f0a43a');
    const release = bot('发布助手', '#4a8ff7');
    const cats = ['全部', '精选', '办公协作', '开发', '客户支持', '日程安排', '更多'].map((label, i) => ({
      label, on: i === 0 ? 'true' : 'false',
      bg: i === 0 ? '#111111' : '#f0f0f2', fg: i === 0 ? '#ffffff' : '#3a3a3c', weight: i === 0 ? '600' : '500'
    }));
    const mine = [
      Object.assign(tile('G', '#1a73e8'), { name: 'Gmail', use: '读邮件、写草稿；发送前需要你确认', bots: [research, cs] }),
      Object.assign(tile('D', '#1c7c3c'), { name: 'Google Drive', use: '搜索、读取和创建文件', bots: [research] }),
      Object.assign(tile('H', '#111111'), { name: 'GitHub', use: '读仓库、开 PR；合并前需要你确认', bots: [release] })
    ].map((m, i) => Object.assign(m, { divider: i === 0 ? 'none' : '1px solid #e3e3e6' }));
    const featured = [
      Object.assign(tile('G', '#1a73e8'), { name: 'Gmail', desc: '搜索、阅读、起草和整理邮件', added: true }),
      Object.assign(tile('C', '#1a73e8'), { name: 'Google Calendar', desc: '查看日程、安排会议', added: false }),
      Object.assign(tile('N', '#111111'), { name: 'Notion', desc: '搜索和编辑 Notion 页面与数据库', added: false }),
      Object.assign(tile('S', '#7a3e9d'), { name: 'Slack', desc: '搜索频道、读取和发送消息', added: false })
    ].map((f) => Object.assign(f, { notAdded: !f.added }));
    const installed = [tile('H', '#111111'), tile('G', '#1a73e8'), tile('D', '#1c7c3c'), tile('X', '#111111')];
    return { cats, mine, featured, installed };
  }
}
</script>
</body>
</html>
