<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 · 技能</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;color:#1d1d1f;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.card{border-radius:16px;background:#f0f0f2;padding:0 18px}
.sk{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 0}
.sk + .sk{border-top:1px solid #e3e3e6}
.ic{width:40px;height:40px;border-radius:11px;background:#ffffff;border:1px solid #e5e5e8;box-sizing:border-box;display:inline-grid;place-items:center}
.t{display:flex;flex-direction:column;gap:3px;min-width:0}.t b{font-size:15px;font-weight:600}.t i{font-style:normal;font-size:13px;color:#6e6e73;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:flex}.av span{width:22px;height:22px;margin-left:-5px;border-radius:7px;border:2px solid #f0f0f2;display:block}
.chip{height:32px;padding:0 14px;border-radius:16px;border:0;font-size:14px;cursor:pointer;white-space:nowrap;background:#f0f0f2}
.chip.on{background:#111111;color:#ffffff;font-weight:600}
.pill{height:32px;padding:0 14px;border-radius:16px;border:0;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.x{position:absolute;right:18px;top:18px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;cursor:pointer;display:inline-grid;place-items:center}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #ffffff; display: grid; grid-template-columns: 300px minmax(0, 1fr)">
<dc-import name="Sidebar" active="channel" hint-size="300px,900px"></dc-import>
<div style="background: #fcfcfc"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(0,0,0,0.34)"></div>
<div role="dialog" aria-modal="true" aria-label="设置" style="position: absolute; left: 190px; top: 80px; width: 1060px; height: 740px; border-radius: 20px; background: #fdfdfd; box-shadow: 0 30px 80px rgba(0,0,0,0.25); display: grid; grid-template-columns: 250px minmax(0, 1fr); overflow: hidden">
<dc-import name="SettingsNav" section="skills" hint-size="250px,740px"></dc-import>
<div style="position: relative; overflow: hidden; padding: 36px 44px; display: flex; flex-direction: column; gap: 16px">
<button type="button" class="x" aria-label="关闭设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding-right: 40px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">技能</h1>
<p style="margin: 0; font-size: 14px; color: #6e6e73">Bot 会做的事。新技能要通过测试或你审核后才能用。</p>
</div>
<button type="button" class="pill" style="background: #111111; color: #ffffff">安装技能</button>
</header>

<div role="tablist" aria-label="按状态筛选" style="display: flex; gap: 8px">
<button type="button" role="tab" aria-selected="true" class="chip on">全部 14</button>
<button type="button" role="tab" aria-selected="false" class="chip">已验证 11</button>
<button type="button" role="tab" aria-selected="false" class="chip">待审核 2</button>
<button type="button" role="tab" aria-selected="false" class="chip">已停用 1</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="margin: 0 4px; font-size: 13px; font-weight: 500; color: #6e6e73">待你审核</span>
<div style="border-radius: 16px; background: #fff7ec; border: 1px solid #f1dcbc; padding: 0 18px">
<div class="sk">
<span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#94480b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></span>
<span class="t"><b>社交媒体监控</b><i>研究助理 在工作中学会 · 需要：浏览器、读取网页</i></span>
<span class="st" style="color: #94480b">待审核</span>
<button type="button" class="pill" style="background: #111111; color: #ffffff">审核</button>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="margin: 0 4px; font-size: 13px; font-weight: 500; color: #6e6e73">已安装</span>
<div class="card">
<div class="sk">
<span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"></path></svg></span>
<span class="t"><b>读取更新日志</b><i>自学 · 1.2.0 · 通过 12 次测试</i></span>
<span class="av" aria-label="研究助理、发布助手 在用"><span style="background: #8b7cf6"></span><span style="background: #4a8ff7"></span></span>
<span class="st" style="color: #1c7c3c">已验证</span>
</div>
<div class="sk">
<span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v12H3zM8 21h8M12 17v4"></path></svg></span>
<span class="t"><b>网页截图对比</b><i>内置 · 2.0.1</i></span>
<span class="av" aria-label="研究助理 在用"><span style="background: #8b7cf6"></span></span>
<span class="st" style="color: #1c7c3c">已验证</span>
</div>
<div class="sk">
<span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6"></path></svg></span>
<span class="t"><b>Markdown 周报</b><i>从模板导入 · 1.0.0</i></span>
<span class="av" aria-label="研究助理、客服小橙 在用"><span style="background: #8b7cf6"></span><span style="background: #f0a43a"></span></span>
<span class="st" style="color: #1c7c3c">已验证</span>
</div>
<div class="sk" style="opacity: 0.6">
<span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"></path></svg></span>
<span class="t"><b>批量重命名文件</b><i>手动添加 · 0.3.0 · 你在 9/20 停用</i></span>
<span class="av"></span>
<span class="st" style="color: #6e6e73">已停用</span>
</div>
</div>
<span style="margin: 2px 4px 0; font-size: 12px; color: #8e8e93">技能表示 Bot 会做什么，不代表它有权操作电脑；真正动手前仍要走审批。</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
