<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 · 导入与导出</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;color:#1d1d1f;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.sec{margin:0 4px;font-size:13px;font-weight:500;color:#6e6e73}
.card{border-radius:16px;background:#f0f0f2;padding:0 18px}
.row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0}
.row + .row{border-top:1px solid #e3e3e6}
.av{width:32px;height:32px;border-radius:9px;display:block}
.t{display:flex;flex-direction:column;gap:3px;min-width:0}.t b{font-size:15px;font-weight:500}.t i{font-style:normal;font-size:13px;color:#6e6e73}
.pill{height:32px;padding:0 14px;border-radius:16px;border:0;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.x{position:absolute;right:18px;top:18px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;cursor:pointer;display:inline-grid;place-items:center}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #ffffff; display: grid; grid-template-columns: 300px minmax(0, 1fr)">
<dc-import name="Sidebar" active="channel" hint-size="300px,900px"></dc-import>
<div style="background: #fcfcfc"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(0,0,0,0.34)"></div>
<div role="dialog" aria-modal="true" aria-label="设置" style="position: absolute; left: 190px; top: 80px; width: 1060px; height: 740px; border-radius: 20px; background: #fdfdfd; box-shadow: 0 30px 80px rgba(0,0,0,0.25); display: grid; grid-template-columns: 250px minmax(0, 1fr); overflow: hidden">
<dc-import name="SettingsNav" section="transfer" hint-size="250px,740px"></dc-import>
<div style="position: relative; overflow: hidden; padding: 36px 44px; display: flex; flex-direction: column; gap: 18px">
<button type="button" class="x" aria-label="关闭设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
<header style="display: flex; flex-direction: column; gap: 6px; padding-right: 40px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">导入与导出</h1>
<p style="margin: 0; font-size: 14px; color: #6e6e73">把 Bot 做成员工模板带到另一台 OpenBot，或者导入别人分享的模板。</p>
</header>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 class="sec">导入员工模板</h2>
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px; border: 1.5px dashed #c7c7cc; border-radius: 16px; background: #fafafa; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6e6e73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
<span style="font-size: 15px; font-weight: 500">把模板文件拖到这里，或点击选择</span>
<span style="font-size: 13px; color: #8e8e93">导入后 Bot 先处于待命状态，技能要逐项审核后才能用</span>
</button>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 class="sec">导出员工模板</h2>
<div class="card">
<div class="row"><span class="av" style="background: #8b7cf6"></span><span class="t"><b>研究助理</b><i>6 项技能 · 可以选择带上 3 条记忆</i></span><button type="button" class="pill" style="background: #ffffff; border: 1px solid #e3e3e6">导出</button></div>
<div class="row"><span class="av" style="background: #4a8ff7"></span><span class="t"><b>发布助手</b><i>6 项技能</i></span><button type="button" class="pill" style="background: #ffffff; border: 1px solid #e3e3e6">导出</button></div>
<div class="row"><span class="av" style="background: #f0a43a; border-radius: 50%"></span><span class="t"><b>客服小橙</b><i>5 项技能</i></span><button type="button" class="pill" style="background: #ffffff; border: 1px solid #e3e3e6">导出</button></div>
</div>
<span style="margin: 2px 4px 0; font-size: 12px; color: #8e8e93">模板里不会带 API Key、登录状态和标为「机密」的记忆；工作主机和审批规则也不会跟着走。</span>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
