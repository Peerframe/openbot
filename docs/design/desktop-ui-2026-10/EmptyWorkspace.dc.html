<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>空工作区</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;color:#1d1d1f;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.start{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;border:1px solid #ececee;border-radius:20px;background:#ffffff;text-align:left;cursor:pointer;width:100%}
.start:hover{background:#f6f6f7}
.start strong{font-size:16px;font-weight:600}
.start span.d{font-size:13px;color:#6e6e73;line-height:1.5}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: grid; grid-template-columns: 300px minmax(0, 1fr); background: #ffffff; overflow: hidden">
<nav aria-label="对话列表" style="width: 300px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; padding: 14px 10px 12px; background: #f5f5f6; border-right: 1px solid #e7e7e9">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 14px 10px">
<div style="display: flex; gap: 8px" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; display: block"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e; display: block"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840; display: block"></span></div>
<button type="button" aria-label="新建" style="width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; display: inline-grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6e6e73" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 11px; margin: 0 4px 6px; border-radius: 10px; background: #eaeaec; border: 1px solid #e0e0e3; font-size: 14px; color: #a1a1a6"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>搜索对话、Bot 和分组</div>
<span style="padding: 24px 14px; font-size: 13px; color: #aeaeb2; line-height: 1.6">对话会出现在这里。</span>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 2px 2px">
<span style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid #e3e3e6; border-radius: 50%; background: #ffffff; color: #6e6e73; font-size: 14px; font-weight: 600; display: inline-grid; place-items: center">我</span>
<span style="flex-grow: 1; height: 44px; border: 1px solid #e3e3e6; border-radius: 22px; background: #ffffff; font-size: 15px; font-weight: 600; display: grid; place-items: center">插件</span>
</div>
</nav>
<main style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: #fcfcfc; padding: 0 40px">
<div style="display: flex; align-items: flex-end; gap: 12px" aria-hidden="true">
<dc-import name="Avatar" character="relay" accent="blue" size="64" hint-size="64px,64px"></dc-import>
<dc-import name="Avatar" character="round" accent="green" size="96" hint-size="96px,96px"></dc-import>
<dc-import name="Avatar" character="scout" accent="yellow" size="64" hint-size="64px,64px"></dc-import>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; text-align: center">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">你的工作，从这里开始</h1>
<p style="margin: 0; font-size: 15px; color: #6e6e73; line-height: 1.6">和左上角「+」是同一个入口：新建 Bot，或者选几个 Bot 建一个频道。</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; width: min(520px, 100%)">
<button type="button" class="start">
<dc-import name="Avatar" character="round" accent="green" size="56" hint-size="56px,56px"></dc-import>
<span style="display: flex; flex-direction: column; gap: 3px"><strong>新建 Bot</strong><span class="d">马上得到一个随机外观的新 Bot；名字、外观和分工随时在右栏改。</span></span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a1a1a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>
<button type="button" class="start">
<dc-import name="GroupAvatar" members="" count="0" size="56" surface="#ffffff" hint-size="56px,56px"></dc-import>
<span style="display: flex; flex-direction: column; gap: 3px"><strong>创建频道</strong><span class="d">选几个 Bot 组成频道，给一件长期的事一个地方。</span></span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a1a1a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>
<button type="button" style="align-self: center; border: 0; background: transparent; font-size: 14px; color: #6e6e73; cursor: pointer; padding: 6px">已有 Bot 模板？导入一个</button>
</div>
<div style="display: flex; gap: 18px; font-size: 12px; color: #8e8e93">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #34c759; display: block"></span>模型服务：Anthropic</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #c7c7cc; display: block"></span>工作电脑：未配对（可选）</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
