<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>选择模型</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;color:#1d1d1f;background:#fcfcfc;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
input::placeholder{color:#a1a1a6}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; background: #fcfcfc; display: flex; flex-direction: column; align-items: center; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 20px; top: 20px; display: flex; gap: 8px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; display: block"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e; display: block"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840; display: block"></span>
</div>
<ol aria-label="设置进度" style="margin: 0; padding: 0; list-style: none; display: flex; gap: 8px; align-items: center; height: 56px; font-size: 13px; color: #8e8e93">
<li>1 这台电脑</li><li aria-hidden="true">—</li><li>2 登录</li><li aria-hidden="true">—</li><li style="color: #1d1d1f; font-weight: 600">3 模型</li>
</ol>

<div style="display: flex; flex-direction: column; align-items: center; gap: 22px; width: 560px; margin-top: 56px">
<dc-import name="Avatar" character="round" accent="green" size="64" hint-size="64px,64px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 8px; text-align: center">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">给 Bot 选一个模型</h1>
<p style="margin: 0; font-size: 15px; color: #6e6e73">连接一个模型服务，Bot 就能开始工作。以后可以在设置里增加或更换。</p>
</div>

<div role="radiogroup" aria-label="模型服务" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%">
<sc-for list="{{providers}}" as="p" hint-placeholder-count="6">
<button type="button" role="radio" aria-checked="{{p.checked}}" style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 14px; border: 2px solid {{p.border}}; border-radius: 16px; background: {{p.bg}}; font: inherit; color: inherit; cursor: pointer; text-align: left">
<span style="width: 30px; height: 30px; flex-shrink: 0; box-sizing: border-box; border-radius: 9px; border: 1px solid #e3e3e6; background: #ffffff; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700">{{p.letter}}</span>
<span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
</button>
</sc-for>
</div>

<form style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: 100%">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6e6e73">API Key
<input type="password" placeholder="sk-ant-…" style="height: 46px; box-sizing: border-box; padding: 0 16px; border: 1px solid #e3e3e6; border-radius: 14px; background: #ffffff; font: inherit; font-size: 15px; color: #1d1d1f; outline: none">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6e6e73">模型
<input type="text" value="claude-sonnet" style="height: 46px; box-sizing: border-box; padding: 0 16px; border: 1px solid #e3e3e6; border-radius: 14px; background: #ffffff; font: inherit; font-size: 15px; color: #1d1d1f; outline: none">
</label>
<span style="grid-column: 1 / -1; font-size: 12px; color: #8e8e93; line-height: 1.5; padding: 0 4px">API Key 加密保存在你的 OpenBot 里；保存前会发一条很短的测试消息确认可用。</span>
<button type="submit" style="grid-column: 1 / -1; height: 48px; border: 0; border-radius: 24px; background: #111111; color: #ffffff; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">测试并开始使用</button>
</form>
<button type="button" style="border: 0; background: transparent; font: inherit; font-size: 14px; color: #6e6e73; cursor: pointer">稍后再设置</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const providers = ['Anthropic', 'OpenAI', 'DeepSeek', 'Kimi', '智谱 / Z.AI', '阿里云百炼'].map((name, i) => ({
      name,
      letter: Array.from(name)[0].toUpperCase(),
      checked: i === 0 ? 'true' : 'false',
      border: i === 0 ? '#111111' : 'transparent',
      bg: i === 0 ? '#ffffff' : '#f0f0f2'
    }));
    return { providers };
  }
}
</script>
</body>
</html>
