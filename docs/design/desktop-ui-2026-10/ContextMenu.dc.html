<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>右键菜单</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;color:#1d1d1f;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.menu{box-sizing:border-box;padding:5px;border-radius:12px;background:#fdfdfd;border:1px solid #e5e5e8;box-shadow:0 10px 30px rgba(0,0,0,0.14);display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;font-size:14px;cursor:pointer;text-align:left}
.item:hover{background:#ececee}
.sep{height:1px;background:#e8e8ea;margin:4px 8px;display:block}
.danger{color:#b3261e}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; display: grid; grid-template-columns: 300px minmax(0, 1fr); background: #fcfcfc; overflow: hidden">
<dc-import name="Sidebar" active="bot" hint-size="300px,900px"></dc-import>

<div style="padding: 64px 72px 0 420px; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">右键菜单</h1>
<p style="margin: 0; max-width: 640px; font-size: 15px; color: #6e6e73; line-height: 1.6">在侧栏任一对话上点右键（或两指轻点）弹出。被点的那一行保持选中底色，菜单贴着鼠标位置出现。Bot 和频道的菜单分开：左边是 Bot，下面是频道。按 Esc 或点空白处关闭。</p>
</header>

<section style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 600; color: #8e8e93">频道的右键菜单</span>
<div role="menu" aria-label="频道操作" class="menu" style="width: 200px">
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"></path></svg>置顶</button>
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><line x1="12" y1="10" x2="12" y2="16"></line><line x1="9" y1="13" x2="15" y2="13"></line></svg>移至新分组</button>
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path><line x1="3" y1="3" x2="21" y2="21"></line></svg>关闭通知</button>
<span class="sep"></span>
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>重命名频道</button>
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c1.2-3.5 3.8-5 7-5s5.8 1.5 7 5"></path><line x1="19" y1="8" x2="19" y2="14"></line><line x1="16" y1="11" x2="22" y2="11"></line></svg>添加 Bot</button>
<span class="sep"></span>
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10 10 0 0 1 12 20c-7 0-10-8-10-8a18 18 0 0 1 4.1-5.1M9.9 4.2A9 9 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.2 3.2"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>从侧栏隐藏</button>
<button type="button" role="menuitem" class="item danger"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3261e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>删除频道…</button>
</div>
</section>

<ul style="margin: 0; padding-left: 18px; max-width: 640px; font-size: 14px; color: #6e6e73; line-height: 1.8">
<li>「删除」一律带省略号，点了先弹确认，说明会不会影响正在执行的任务。</li>
<li>「从侧栏隐藏」只是收起，搜索时仍能找到；收到新消息会重新出现。</li>
</ul>
</div>

<div role="menu" aria-label="研究助理 的操作" class="menu" style="position: absolute; left: 196px; top: 200px; width: 196px">
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"></path></svg>置顶</button>
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><line x1="12" y1="10" x2="12" y2="16"></line><line x1="9" y1="13" x2="15" y2="13"></line></svg>移至新分组</button>
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path><circle cx="18" cy="5" r="2.5" fill="#1d1d1f" stroke="none"></circle></svg>标为未读</button>
<span class="sep"></span>
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>重命名 Bot</button>
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="11" r="2.5"></circle><path d="M5.5 17c.8-1.8 2-2.6 3.5-2.6s2.7.8 3.5 2.6"></path><line x1="15" y1="10" x2="18" y2="10"></line><line x1="15" y1="14" x2="18" y2="14"></line></svg>编辑资料</button>
<span class="sep"></span>
<button type="button" role="menuitem" class="item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10 10 0 0 1 12 20c-7 0-10-8-10-8a18 18 0 0 1 4.1-5.1M9.9 4.2A9 9 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.2 3.2"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>从侧栏隐藏</button>
<button type="button" role="menuitem" class="item danger"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3261e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>删除 Bot…</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
