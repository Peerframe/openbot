<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 · 员工浏览器</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;color:#1d1d1f;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.sec{margin:0 4px;font-size:13px;font-weight:500;color:#6e6e73}
.card{border-radius:16px;background:#f0f0f2;padding:0 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:9px 0;box-sizing:border-box}
.row + .row{border-top:1px solid #e3e3e6}
.t{display:flex;flex-direction:column;gap:3px}.t b{font-size:15px;font-weight:500}.t i{font-style:normal;font-size:13px;color:#6e6e73}
.select{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid #e3e3e6;border-radius:10px;background:#ffffff;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.sw{width:44px;height:26px;border:0;padding:0;border-radius:13px;position:relative;cursor:pointer;flex-shrink:0}.sw.on{background:#111111}.sw.off{background:#d1d1d6}
.sw span{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#ffffff;display:block}.sw.on span{right:3px}.sw.off span{left:3px}
.pill{height:32px;padding:0 14px;border-radius:16px;border:0;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.x{position:absolute;right:18px;top:18px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;cursor:pointer;display:inline-grid;place-items:center}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #ffffff; display: grid; grid-template-columns: 300px minmax(0, 1fr)">
<dc-import name="Sidebar" active="channel" hint-size="300px,900px"></dc-import>
<div style="background: #fcfcfc"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(0,0,0,0.34)"></div>
<div role="dialog" aria-modal="true" aria-label="设置" style="position: absolute; left: 190px; top: 80px; width: 1060px; height: 740px; border-radius: 20px; background: #fdfdfd; box-shadow: 0 30px 80px rgba(0,0,0,0.25); display: grid; grid-template-columns: 250px minmax(0, 1fr); overflow: hidden">
<dc-import name="SettingsNav" section="browser" hint-size="250px,740px"></dc-import>
<div style="position: relative; overflow: hidden; padding: 36px 44px; display: flex; flex-direction: column; gap: 18px">
<button type="button" class="x" aria-label="关闭设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
<header style="display: flex; flex-direction: column; gap: 6px; padding-right: 40px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">员工浏览器</h1>
<p style="margin: 0; font-size: 14px; color: #6e6e73">Bot 上网用的独立浏览器，跑在隔离的容器里，和你自己的浏览器互不影响。</p>
</header>

<div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 16px; background: #ffffff; border: 1px solid #e3e3e6">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #34c759; display: block; flex-shrink: 0"></span>
<span class="t" style="flex-grow: 1"><b>运行中 · 我的 MacBook Pro</b><i>Docker 容器 · 2 个 Bot 正在用</i></span>
<button type="button" class="pill" style="background: #ececee">打开查看</button>
<button type="button" class="pill" style="background: transparent; color: #b3261e">重启</button>
</div>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 class="sec">隔离与登录</h2>
<div class="card">
<div class="row"><span class="t"><b>每个 Bot 用单独的浏览器档案</b><i>登录状态和 Cookie 不在 Bot 之间共享</i></span><button type="button" role="switch" aria-checked="true" aria-label="每个 Bot 用单独的浏览器档案" class="sw on"><span></span></button></div>
<div class="row"><span class="t"><b>可以访问的网站</b><i>内网地址和本机地址始终不允许</i></span><button type="button" class="select">所有公开网站<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6e6e73" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button></div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 class="sec">文件与截图</h2>
<div class="card">
<div class="row"><span class="t"><b>下载的文件</b><i>保存在容器里，Bot 发给你之前你看不到</i></span><button type="button" class="select">7 天后清除<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6e6e73" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button></div>
<div class="row"><span class="t"><b>任务截图</b><i>任务详情里的执行画面</i></span><button type="button" class="select">保留 30 天<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6e6e73" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button></div>
<div class="row"><span class="t"><b>清除所有浏览数据</b><i>登录状态、Cookie、缓存都会删掉</i></span><button type="button" class="pill" style="background: #ffffff; border: 1px solid #e3e3e6; color: #b3261e">清除…</button></div>
</div>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
