<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 · 审计记录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;color:#1d1d1f;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.card{border-radius:16px;background:#f0f0f2;padding:0 18px}
.ev{display:grid;grid-template-columns:64px 26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0}
.ev + .ev{border-top:1px solid #e3e3e6}
.tm{font-size:13px;color:#8e8e93;font-variant-numeric:tabular-nums}
.who{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;font-size:11px;font-weight:600}
.t{display:flex;flex-direction:column;gap:2px;min-width:0}.t b{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t i{font-style:normal;font-size:12px;color:#8e8e93}
.res{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.chip{height:32px;padding:0 14px;border-radius:16px;border:0;font-size:14px;cursor:pointer;white-space:nowrap;background:#f0f0f2}
.chip.on{background:#111111;color:#ffffff;font-weight:600}
.pill{height:32px;padding:0 14px;border-radius:16px;border:0;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.x{position:absolute;right:18px;top:18px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;cursor:pointer;display:inline-grid;place-items:center}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #ffffff; display: grid; grid-template-columns: 300px minmax(0, 1fr)">
<dc-import name="Sidebar" active="channel" hint-size="300px,900px"></dc-import>
<div style="background: #fcfcfc"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(0,0,0,0.34)"></div>
<div role="dialog" aria-modal="true" aria-label="设置" style="position: absolute; left: 190px; top: 80px; width: 1060px; height: 740px; border-radius: 20px; background: #fdfdfd; box-shadow: 0 30px 80px rgba(0,0,0,0.25); display: grid; grid-template-columns: 250px minmax(0, 1fr); overflow: hidden">
<dc-import name="SettingsNav" section="audit" hint-size="250px,740px"></dc-import>
<div style="position: relative; overflow: hidden; padding: 36px 44px; display: flex; flex-direction: column; gap: 16px">
<button type="button" class="x" aria-label="关闭设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding-right: 40px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">审计记录</h1>
<p style="margin: 0; font-size: 14px; color: #6e6e73">谁在什么时候做了什么。记录只能查看，不能修改或删除。</p>
</div>
<button type="button" class="pill" style="background: #ececee">导出 CSV</button>
</header>

<div style="display: flex; gap: 8px">
<button type="button" class="chip on">全部</button>
<button type="button" class="chip">审批</button>
<button type="button" class="chip">设置变更</button>
<button type="button" class="chip">登录</button>
<button type="button" class="chip">主机</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="margin: 0 4px; font-size: 13px; font-weight: 500; color: #6e6e73">今天</span>
<div class="card">
<div class="ev"><span class="tm">10:31</span><span class="who" style="background: #e3e3e6; color: #6e6e73">我</span><span class="t"><b>批准：发送邮件给 team@example.com</b><i>研究助理 · # 市场周报</i></span><span class="res" style="background: #e6f4ea; color: #1c7c3c">已批准</span></div>
<div class="ev"><span class="tm">10:28</span><span class="who" style="background: #8b7cf6"></span><span class="t"><b>请求：删除临时文件夹里的 12 个文件</b><i>研究助理 · 我的 MacBook Pro</i></span><span class="res" style="background: #e5e5e8; color: #6e6e73">已过期</span></div>
<div class="ev"><span class="tm">09:50</span><span class="who" style="background: #e3e3e6; color: #6e6e73">我</span><span class="t"><b>拒绝：在构建机上安装软件包 marked</b><i>发布助手 · # 发布协作</i></span><span class="res" style="background: #fdecea; color: #a13731">已拒绝</span></div>
<div class="ev"><span class="tm">09:12</span><span class="who" style="background: #e3e3e6; color: #6e6e73">我</span><span class="t"><b>修改设置：发送邮件改为「每次都问」</b><i>审批与权限</i></span><span class="res" style="background: #ffffff; color: #3a3a3c">设置</span></div>
<div class="ev"><span class="tm">08:40</span><span class="who" style="background: #e3e3e6; color: #6e6e73">我</span><span class="t"><b>登录 OpenBot</b><i>本机</i></span><span class="res" style="background: #ffffff; color: #3a3a3c">登录</span></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="margin: 0 4px; font-size: 13px; font-weight: 500; color: #6e6e73">昨天</span>
<div class="card">
<div class="ev"><span class="tm">18:05</span><span class="who" style="background: #e3e3e6; color: #6e6e73">我</span><span class="t"><b>配对新主机：构建机</b><i>工作主机</i></span><span class="res" style="background: #ffffff; color: #3a3a3c">主机</span></div>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
