<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 · 例行任务</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;color:#1d1d1f;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.card{border-radius:16px;background:#f0f0f2;padding:0 18px}
.rt{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 0}
.rt + .rt{border-top:1px solid #e3e3e6}
.av{width:36px;height:36px;border-radius:10px;display:block}
.t{display:flex;flex-direction:column;gap:4px;min-width:0}.t b{font-size:15px;font-weight:600}.t i{font-style:normal;font-size:13px;color:#6e6e73}
.when{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;color:#3a3a3c;white-space:nowrap}.when small{font-size:12px;color:#8e8e93}
.sw{width:44px;height:26px;border:0;padding:0;border-radius:13px;position:relative;cursor:pointer;flex-shrink:0}.sw.on{background:#111111}.sw.off{background:#d1d1d6}
.sw span{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#ffffff;display:block}.sw.on span{right:3px}.sw.off span{left:3px}
.pill{height:32px;padding:0 14px;border-radius:16px;border:0;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.x{position:absolute;right:18px;top:18px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;cursor:pointer;display:inline-grid;place-items:center}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #ffffff; display: grid; grid-template-columns: 300px minmax(0, 1fr)">
<dc-import name="Sidebar" active="channel" hint-size="300px,900px"></dc-import>
<div style="background: #fcfcfc"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(0,0,0,0.34)"></div>
<div role="dialog" aria-modal="true" aria-label="设置" style="position: absolute; left: 190px; top: 80px; width: 1060px; height: 740px; border-radius: 20px; background: #fdfdfd; box-shadow: 0 30px 80px rgba(0,0,0,0.25); display: grid; grid-template-columns: 250px minmax(0, 1fr); overflow: hidden">
<dc-import name="SettingsNav" section="routines" hint-size="250px,740px"></dc-import>
<div style="position: relative; overflow: hidden; padding: 36px 44px; display: flex; flex-direction: column; gap: 18px">
<button type="button" class="x" aria-label="关闭设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding-right: 40px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">例行任务</h1>
<p style="margin: 0; font-size: 14px; color: #6e6e73">让 Bot 按时间表自动做事，结果发到指定频道。</p>
</div>
<button type="button" class="pill" style="background: #111111; color: #ffffff">新建例行任务</button>
</header>

<div class="card">
<div class="rt">
<span class="av" style="background: #8b7cf6"></span>
<span class="t"><b>整理本周竞品动态</b><i>研究助理 · 发到 # 市场周报 · 每周五 09:00</i></span>
<span class="when">下次：周五 09:00<small>上次：成功 · 9/26</small></span>
<button type="button" role="switch" aria-checked="true" aria-label="启用 整理本周竞品动态" class="sw on"><span></span></button>
</div>
<div class="rt">
<span class="av" style="background: #8e8e93; border-radius: 50%"></span>
<span class="t"><b>凌晨巡检服务器</b><i>运维值班 · 发到 # 发布协作 · 每天 03:00</i></span>
<span class="when">下次：明天 03:00<small style="color: #b3261e">上次：失败 · 今天</small></span>
<button type="button" role="switch" aria-checked="true" aria-label="启用 凌晨巡检服务器" class="sw on"><span></span></button>
</div>
<div class="rt" style="opacity: 0.6">
<span class="av" style="background: #f0a43a; border-radius: 50%"></span>
<span class="t"><b>汇总昨天的客户工单</b><i>客服小橙 · 发到 # 客户反馈 · 工作日 10:00</i></span>
<span class="when">已暂停<small>你在 9/22 暂停</small></span>
<button type="button" role="switch" aria-checked="false" aria-label="启用 汇总昨天的客户工单" class="sw off"><span></span></button>
</div>
</div>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 4px; font-size: 13px; font-weight: 500; color: #6e6e73">新建时填写</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="border-radius: 14px; background: #ffffff; border: 1px solid #e3e3e6; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #8e8e93">交给谁</span><span style="font-size: 14px">研究助理</span></div>
<div style="border-radius: 14px; background: #ffffff; border: 1px solid #e3e3e6; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #8e8e93">什么时候</span><span style="font-size: 14px">每周五 09:00</span></div>
<div style="grid-column: span 2; border-radius: 14px; background: #ffffff; border: 1px solid #e3e3e6; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #8e8e93">做什么</span><span style="font-size: 14px; line-height: 1.5">整理三家竞品本周的更新，做成一页周报发到 # 市场周报</span></div>
</div>
<span style="margin: 2px 4px 0; font-size: 12px; color: #8e8e93">例行任务里的敏感操作也要你批准；你不在时请求会过期，任务会停下并通知你。</span>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
