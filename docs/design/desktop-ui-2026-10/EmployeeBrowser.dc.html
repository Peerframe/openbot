<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bot 的浏览器</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;color:#1d1d1f;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.icon-btn{width:32px;height:32px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:inline-grid;place-items:center}
.pill{height:34px;padding:0 16px;border-radius:17px;border:0;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;background:#ececee}
.pill.small{height:28px;padding:0 12px;border-radius:14px;font-size:13px}
.pill.primary{background:#111111;color:#ffffff}
.pill.danger{background:#fbe9e7;color:#b3261e}
.tab{height:34px;padding:0 16px;border-radius:17px;border:0;font-size:14px;cursor:pointer;white-space:nowrap;background:#f0f0f2;font-weight:500}
.tab[aria-selected="true"]{background:#111111;color:#ffffff;font-weight:600}
.chip{height:28px;padding:0 12px;border-radius:14px;border:0;font-size:13px;cursor:pointer;background:#f0f0f2;color:#3a3a3c;white-space:nowrap}
.chip[aria-pressed="true"]{background:#111111;color:#ffffff}
.card{border-radius:18px;background:#f0f0f2;padding:0 18px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0}
.row + .row{border-top:1px solid #e3e3e6}
.t{display:flex;flex-direction:column;gap:3px;min-width:0}
.t strong{font-size:14px;font-weight:500}
.sub{font-size:12px;color:#8e8e93}
.h2{margin:0;font-size:17px;font-weight:600}
.h3{margin:0 4px;font-size:13px;font-weight:500;color:#6e6e73}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:#ffffff;font-size:12px;color:#6e6e73}
.field{width:100%;box-sizing:border-box;border:1px solid #e3e3e6;border-radius:12px;background:#ffffff;padding:10px 14px;font:inherit;font-size:14px;color:#1d1d1f;outline:none}
.label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#6e6e73}
.switch{width:40px;height:24px;border:0;padding:0;border-radius:12px;background:#d1d1d6;position:relative;cursor:pointer;flex-shrink:0}
.switch[aria-checked="true"]{background:#111111}
.switch span{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#ffffff;display:block}
.switch[aria-checked="true"] span{left:19px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.ok{color:#1c7c3c}.warn{color:#94480b}.bad{color:#b3261e}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #ffffff; display: grid; grid-template-columns: 300px minmax(0, 1fr)">
<dc-import name="Sidebar" active="bot" hint-size="300px,900px"></dc-import>
<div style="background: #fcfcfc"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.34)"></div>
<section role="dialog" aria-modal="true" aria-label="研究助理 的浏览器" style="position: absolute; left: 330px; top: 48px; width: 1080px; height: 804px; box-sizing: border-box; border-radius: 22px; background: #fdfdfd; box-shadow: 0 30px 80px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden">
<header style="height: 60px; flex-shrink: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 0 14px 0 20px; border-bottom: 1px solid #ececee">
<span style="display: flex; align-items: center; gap: 10px"><dc-import name="Avatar" character="round" accent="green" size="28" hint-size="28px,28px"></dc-import><strong style="font-size: 15px">研究助理 的浏览器</strong><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; background: #fdf0e1; color: #94480b; font-size: 12px; font-weight: 600">你正在控制</span></span>
<input type="text" class="field" value="https://b-company.com/pricing" aria-label="网址" style="height: 36px; padding: 0 14px; border-radius: 18px; background: #f6f6f7">
<span style="display: flex; gap: 8px; align-items: center"><button type="button" class="pill primary">交还 Bot</button><button type="button" class="icon-btn" aria-label="关闭浏览器"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button></span>
</header>
<div style="flex-grow: 1; min-height: 0; padding: 16px; background: #f0f0f2; display: flex; flex-direction: column; gap: 10px">
<div style="flex-grow: 1; border-radius: 12px; background: #e3e5ea; display: grid; place-items: center; color: #8e8e93; font-size: 14px">[实时画面 · 点击网页、滚动和输入都会发到工作电脑]</div>
<div style="display: flex; align-items: center; gap: 8px">
<input type="text" class="field" placeholder="先点网页里的输入框，再在这里输入或粘贴" aria-label="输入文字" style="flex-grow: 1; height: 36px; padding: 0 14px; border-radius: 18px">
<button type="button" class="pill small">全选</button><button type="button" class="pill small">退格</button><button type="button" class="pill small">回车</button>
</div>
</div>
<footer style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-top: 1px solid #ececee">
<span class="sub">在 我的 MacBook Pro 上运行 · 登录状态留在工作电脑 · 画面只在内存里保留</span>
<span class="sub">关闭窗口会暂停控制，完成后请点「交还 Bot」</span>
</footer>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
