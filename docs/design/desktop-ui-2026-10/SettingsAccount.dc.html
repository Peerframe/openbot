<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 · 账户与安全</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;color:#1d1d1f;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.sec{margin:0 4px;font-size:13px;font-weight:500;color:#6e6e73}
.card{border-radius:16px;background:#f0f0f2;padding:0 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:62px;padding:10px 0;box-sizing:border-box}
.row + .row{border-top:1px solid #e3e3e6}
.pill{height:34px;padding:0 16px;border-radius:17px;border:0;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #ffffff; display: grid; grid-template-columns: 300px minmax(0, 1fr)">
<dc-import name="Sidebar" active="channel" hint-size="300px,900px"></dc-import>
<div style="background: #fcfcfc"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(0,0,0,0.34)"></div>

<div role="dialog" aria-modal="true" aria-label="设置" style="position: absolute; left: 190px; top: 80px; width: 1060px; height: 740px; border-radius: 20px; background: #fdfdfd; box-shadow: 0 30px 80px rgba(0,0,0,0.25); display: grid; grid-template-columns: 250px minmax(0, 1fr); overflow: hidden">
<dc-import name="SettingsNav" section="account" hint-size="250px,740px"></dc-import>
<div style="position: relative; overflow: hidden; padding: 40px 44px; display: flex; flex-direction: column; gap: 20px">
<button type="button" aria-label="关闭设置" style="position: absolute; right: 18px; top: 18px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; display: inline-grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
<h1 style="margin: 0; font-size: 24px; font-weight: 700">账户与安全</h1>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 class="sec">账户</h2>
<div style="border-radius: 16px; background: #f0f0f2; padding: 20px 18px; display: flex; align-items: center; gap: 16px">
<span style="width: 60px; height: 60px; border-radius: 50%; background: #e3e3e6; color: #6e6e73; font-size: 20px; font-weight: 600; display: inline-grid; place-items: center; flex-shrink: 0">我</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 600">[你的名字]</span><span style="font-size: 14px; color: #6e6e73">本地 Owner · 这台 OpenBot 的唯一管理员</span></span>
<button type="button" class="pill" style="background: #e3e3e6">退出登录</button>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 class="sec">安全</h2>
<div class="card">
<div class="row"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 500">Owner 密码</span><span style="font-size: 13px; color: #6e6e73">用来登录 OpenBot 和批准敏感操作</span></span><button type="button" class="pill" style="background: #ffffff; border: 1px solid #e3e3e6">修改密码</button></div>
<div class="row"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 500">登录的设备</span><span style="font-size: 13px; color: #6e6e73">本机（当前）· 另外 1 台设备</span></span><button type="button" class="pill" style="background: #ffffff; border: 1px solid #e3e3e6">退出其他设备</button></div>
<div class="row"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 500">审计记录</span><span style="font-size: 13px; color: #6e6e73">所有批准、敏感操作和配置变更都有记录</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 class="sec">Bot 的权限边界</h2>
<div class="card">
<div class="row"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 500">敏感操作先问我</span><span style="font-size: 13px; color: #6e6e73">发消息、提交表单、删除数据、安装软件、改权限时，都要你批准</span></span><span style="font-size: 13px; color: #6e6e73; white-space: nowrap">始终开启</span></div>
</div>
<span style="margin: 2px 4px 0; font-size: 12px; color: #8e8e93">凭证只发送给你自己的 OpenBot。</span>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
