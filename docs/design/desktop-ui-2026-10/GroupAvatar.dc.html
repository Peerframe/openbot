<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>群组头像</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes ga-pulse{0%{box-shadow:0 0 0 var(--ring-w) var(--ring),0 0 0 var(--ring-w) rgba(52,199,89,.45)}70%,100%{box-shadow:0 0 0 var(--ring-w) var(--ring),0 0 0 calc(var(--ring-w) + 6px) rgba(52,199,89,0)}}
.ga-dot-working{animation:ga-pulse 1.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.ga-dot-working{animation:none}}
</style>
</helmet>
<span style="position: relative; display: block; width: {{size}}px; height: {{size}}px; flex-shrink: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif">
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; inset: 0; border-radius: {{tileRadius}}px; background: #e6e6e8; display: grid; place-items: center; color: #6e6e73; font-size: {{hashSize}}px; font-weight: 600">#</span>
</sc-if>

<sc-if value="{{showBack}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; left: {{backX}}px; top: {{backY}}px; display: block"><dc-import name="Avatar" character="{{b.character}}" accent="{{b.accent}}" size="{{backSize}}" hint-size="25px,25px"></dc-import></span>
</sc-if>
<sc-if value="{{showThird}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: {{thirdX}}px; top: {{thirdY}}px; display: block"><dc-import name="Avatar" character="{{c.character}}" accent="{{c.accent}}" size="{{backSize}}" cutout="{{surface}}" hint-size="22px,22px"></dc-import></span>
</sc-if>
<sc-if value="{{showFront}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; left: {{frontX}}px; top: {{frontY}}px; display: block"><dc-import name="Avatar" character="{{a.character}}" accent="{{a.accent}}" size="{{frontSize}}" cutout="{{frontCutout}}" state="{{frontState}}" hint-size="25px,25px"></dc-import></span>
</sc-if>
<sc-if value="{{hasDot}}" hint-placeholder-val="{{false}}">
<span class="{{dotClass}}" aria-hidden="true" style="--ring: {{surface}}; --ring-w: {{ring}}px; position: absolute; left: {{dotX}}px; top: {{dotY}}px; z-index: 1; width: {{dotSize}}px; height: {{dotSize}}px; box-sizing: border-box; border-radius: 50%; background: {{dotColor}}; box-shadow: 0 0 0 {{ring}}px {{surface}}; display: block"></span>
</sc-if>
<sc-if value="{{showChip}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: {{chipX}}px; top: {{chipY}}px; width: {{chipSize}}px; height: {{chipSize}}px; box-sizing: border-box; border-radius: 50%; background: {{chipBg}}; box-shadow: 0 0 0 {{ring}}px {{surface}}; display: grid; place-items: center; color: {{chipInk}}; font-size: {{chipFont}}px; font-weight: 700; letter-spacing: -0.02em">{{chipText}}</span>
</sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"members":{"editor":"text","default":"round:green,scout:yellow"},"count":{"editor":"int","min":-1,"max":99,"default":-1},"size":{"editor":"int","min":16,"max":160,"default":40},"surface":{"editor":"text","default":"#f5f5f6"},"state":{"editor":"enum","options":["idle","working","attention"],"default":"idle"},"$preview":{"width":40,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    // members: "character:accent" in channel order; the first member sits in front.
    const parsed = String(this.props.members ?? '').split(',').map((s) => s.trim()).filter(Boolean)
      .map((s) => { const [character, accent] = s.split(':'); return { character: character || 'round', accent: accent || 'green' }; });
    const declared = Number(this.props.count ?? -1);
    const n = declared >= 0 ? declared : parsed.length;
    const S = Number(this.props.size ?? 40);
    const surface = this.props.surface || '#f5f5f6';
    const r = (v) => Math.round(v * 10) / 10;
    const ring = S >= 64 ? 3 : 2;
    const a = parsed[0] ?? { character: 'round', accent: 'green' };
    const b = parsed[1] ?? a;
    const c = parsed[2] ?? b;
    const base = {
      size: S, surface, ring, a, b, c,
      isEmpty: n === 0, showBack: false, showThird: false, showFront: false, showChip: false,
      tileRadius: r(S * 0.3), hashSize: r(S * 0.45),
      backSize: 0, backX: 0, backY: 0, thirdX: 0, thirdY: 0,
      frontSize: 0, frontX: 0, frontY: 0, frontCutout: surface,
      chipSize: 0, chipX: 0, chipY: 0, chipFont: 0, chipText: '', chipBg: '#e6e6e8', chipInk: '#3a3a3c'
    };
    const state = this.props.state ?? 'idle';
    const withDot = (layout) => {
      // One dot for the whole 频道: any member working (green, pulsing) or waiting for the Owner
      // (orange). It sits lower right, or upper right when the # or +N badge holds that corner.
      if (state === 'idle' || n === 0) return Object.assign(layout, { hasDot: false });
      const dot = Math.max(8, Math.round(S * 0.28));
      const top = layout.showChip;
      return Object.assign(layout, {
        hasDot: true, dotSize: dot, dotX: r(S - dot + 1), dotY: top ? -1 : r(S - dot + 1),
        dotColor: state === 'working' ? '#34c759' : '#e08a00', dotClass: state === 'working' ? 'ga-dot-working' : '',
        frontState: state === 'working' ? 'working' : 'idle'
      });
    };
    base.frontState = 'idle';
    if (n === 1) {
      // One Bot in a channel: its head plus a small # so a channel never reads as a direct chat.
      const f = r(S * 0.74), chip = r(S * 0.42);
      return withDot(Object.assign(base, {
        showFront: true, frontSize: f, frontX: 0, frontY: 0, frontCutout: '',
        showChip: true, chipSize: chip, chipX: r(S - chip), chipY: r(S - chip), chipFont: r(chip * 0.56), chipText: '#', chipBg: '#dadadd'
      }));
    }
    if (n === 2) {
      const f = r(S * 0.66);
      return withDot(Object.assign(base, {
        showBack: true, backSize: f, backX: 0, backY: 0,
        showFront: true, frontSize: f, frontX: r(S - f), frontY: r(S - f)
      }));
    }
    if (n === 3) {
      const back = r(S * 0.56), f = r(S * 0.62);
      return withDot(Object.assign(base, {
        showBack: true, backSize: back, backX: 0, backY: r(S * 0.02),
        showThird: true, thirdX: r(S - back), thirdY: 0,
        showFront: true, frontSize: f, frontX: r((S - f) / 2), frontY: r(S - f)
      }));
    }
    if (n >= 4) {
      // Two heads stay legible; the rest becomes a count instead of a crowd of tiny heads.
      const f = r(S * 0.64), chip = r(S * 0.46);
      return withDot(Object.assign(base, {
        showBack: true, backSize: f, backX: r(S - f), backY: 0,
        showFront: true, frontSize: f, frontX: 0, frontY: r(S - f),
        showChip: true, chipSize: chip, chipX: r(S - chip), chipY: r(S - chip),
        chipFont: r(chip * (n - 2 > 9 ? 0.4 : 0.48)), chipText: '+' + (n - 2), chipBg: '#20251f', chipInk: '#fafbf7'
      }));
    }
    return Object.assign(base, { hasDot: false });
  }
}
</script>
</body>
</html>
