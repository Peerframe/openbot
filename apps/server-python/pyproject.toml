[project]
name = "openbot-server"
version = "0.0.0"
description = "Experimental Python OpenBot control-plane reference"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "pydantic==2.13.5",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.53.0",
  "openai==3.17.0",
  "anthropic==1.8.0",
  "cryptography==50.0.1",
  "joserfc==1.7.5",
  "rfc8785==0.1.4",
  "httpx2==2.13.0",
  "PyYAML==6.0.3",
  "mcp==1.29.0",
  "jsonschema==4.26.0",
  "websockets==17.0.1",
  "beautifulsoup4==4.15.0",
  "soupsieve==2.8.3",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
