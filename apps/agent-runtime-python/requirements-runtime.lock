# Frozen runtime-only transitive closure for requirements.txt.
#
# This is the complete closure reachable from the direct runtime pins, at the
# same versions as requirements.lock. Test-only distributions are intentionally
# absent (pytest and its closure: iniconfig, packaging, pluggy, Pygments), so a
# production image can install this file without ever shipping a test runner.
#
# The split was derived from installed distribution metadata
# (importlib.metadata.requires, extra-guarded requirements skipped), not guessed:
# see RESEARCH.md section 10. Regenerate deliberately. The two locks must always
# agree on every pin they share.
#
# Install:  python -m venv .venv
#           ./.venv/bin/pip install -r requirements-runtime.lock
# Verify:   ./.venv/bin/python scripts/verify_environment.py --profile runtime
#
# Python 3.12, macOS arm64 (cp312 wheels).
