version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Ordinary version bumps require the reviewed intake in CONTRIBUTING.md.
    # GitHub security updates are exempt from this limit.
    open-pull-requests-limit: 0
    groups:
      react:
        # React requires the client and DOM renderer runtime versions to match.
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /deploy/server
    schedule:
      interval: monthly
    # Ordinary updates use the same reviewed intake; security updates are exempt.
    open-pull-requests-limit: 0
    # Official ignore mechanism for SemVer majors:
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#ignore
    # Keep automatic Docker Node majors off the default lane. Reviewed batches
    # may advance patch/minor versions; security proposals retain these rules. A Node major
    # (for example 24 → 26) requires human review against
    # docs/research/server-node24-production-container.md before any Dockerfile
    # pin change; do not treat Dependabot PR #3 (26.x) as the upgrade path.
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
