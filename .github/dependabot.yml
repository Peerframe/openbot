version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        # React requires the client and DOM renderer runtime versions to match.
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /deploy/server
    schedule:
      interval: monthly
    # Cap concurrent Docker version-update PRs. Security updates are exempt from
    # this limit per GitHub Dependabot docs (open-pull-requests-limit).
    open-pull-requests-limit: 5
    # Official ignore mechanism for SemVer majors:
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#ignore
    # Keep automatic Docker Node majors off the default lane. Patch/minor Node
    # image updates (and security updates) remain eligible. A Node major
    # (for example 24 → 26) requires human review against
    # docs/research/server-node24-production-container.md before any Dockerfile
    # pin change; do not treat Dependabot PR #3 (26.x) as the upgrade path.
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
