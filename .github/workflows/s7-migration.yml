name: S7 synthetic migration qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Verify sealed historical SQL and current target pin
        run: node experiments/s7-migration/sources.mjs
      - name: Build the existing migration guard and artifact reader
        run: npm run oracle:build
      - name: Check cleanup after unknown container startup
        run: node --test experiments/s7-migration/cleanup.test.mjs
      - name: Qualify both synthetic histories and paired restores
        run: node experiments/s7-migration/qualify.mjs --report "$RUNNER_TEMP/s7-migration-summary.json"
      - name: Retain content-free qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s7-synthetic-migration-${{ github.sha }}
          path: ${{ runner.temp }}/s7-migration-summary.json
          if-no-files-found: warn
          retention-days: 14
