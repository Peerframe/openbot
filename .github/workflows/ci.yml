name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - name: Select the reviewed npm CLI
        run: |
          npm install --global npm@10.9.9 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.9"
      - name: Validate the dependency tree from the lockfile
        run: npm ci --ignore-scripts --audit=false
      - name: Audit production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Scan Git history for credential patterns without verification or uploads
        shell: bash
        run: |
          umask 077
          set +e
          docker run --rm --volume "${{ github.workspace }}:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog@sha256:deb2af10659a488a14d262a323addcde099d99827a1cf1dc4e93c17915c39f08 \
            --no-verification --results=unverified --filter-unverified --no-update \
            --json --fail --fail-on-scan-errors git file:///repo \
            >"${RUNNER_TEMP}/trufflehog-results.jsonl" 2>"${RUNNER_TEMP}/trufflehog-diagnostics.log"
          status=$?
          set -e
          node scripts/check-credential-findings.mjs "${RUNNER_TEMP}/trufflehog-results.jsonl" "$status"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify real public HTTPS reading on the hosted network
        env:
          OPENBOT_LIVE_SOURCE_TEST: "1"
        run: npm exec --workspace @openbot/server -- vitest run src/agent-sources.live.test.ts

  portable:
    name: Portable (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Windows x64
            runner: windows-2025
          - name: macOS arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Verify native Desktop bootstrap behavior
        run: node --test scripts/install-desktop.test.mjs
      - name: Verify Windows receipt identity before native packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-receipt-identity.ps1
      - name: Verify installer progress and timeout bounds
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-installer-progress.ps1
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Verify plugin isolation in native Desktop Chromium
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: node apps/desktop/scripts/check-plugin-sandbox.mjs
      - name: Build the pinned macOS Worker companion
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm install --global npm@10.9.9 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.9"
          runtime_archive="$RUNNER_TEMP/node-v22.22.2-darwin-arm64.tar.gz"
          companion_root="$RUNNER_TEMP/openbot-worker-companion"
          source_commit="$(git rev-parse HEAD)"
          npm_cli="$(command -v npm)"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://nodejs.org/dist/v22.22.2/node-v22.22.2-darwin-arm64.tar.gz \
            --output "$runtime_archive"
          mkdir -p "$companion_root"
          node scripts/build-macos-worker-host-candidate.mjs \
            --arch arm64 \
            --build-version 1 \
            --node-archive "$runtime_archive" \
            --npm-cli "$npm_cli" \
            --out-dir "$companion_root" \
            --source-commit "$source_commit" \
            --version 0.0.0
          echo "OPENBOT_DESKTOP_MACOS_WORKER_COMPANION=$companion_root/OpenBot Worker Host.app" \
            >> "$GITHUB_ENV"
      - name: Build and verify the auditable Windows PostgreSQL runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'openbot-windows-postgresql'
          ./scripts/build-windows-postgresql.ps1 -OutputDirectory $runtime
          "OPENBOT_WINDOWS_POSTGRES_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify retained 17.10 cluster data with the new Windows database
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-postgresql-upgrade.ps1 -RuntimeDirectory "$env:OPENBOT_WINDOWS_POSTGRES_RUNTIME"
      - name: Retain PostgreSQL source, license notices, and build provenance
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-postgresql-source-and-provenance-${{ github.sha }}
          path: |
            ${{ env.OPENBOT_WINDOWS_POSTGRES_RUNTIME }}/licenses
            ${{ env.OPENBOT_WINDOWS_POSTGRES_RUNTIME }}/openbot-postgresql-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Package the unsigned Desktop development artifact
        run: npm run package --workspace @openbot/desktop
      - name: Make the unsigned Desktop installers from the verified package
        run: npm run make:installers --workspace @openbot/desktop
      - name: Validate Windows per-user installation and native Server lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $electronPathFile = Join-Path $env:RUNNER_TEMP 'openbot-electron-path.txt'
          node -e "const r=require('node:module').createRequire(require('node:path').resolve('apps/desktop/package.json'));require('node:fs').writeFileSync(process.argv[1],r('electron'));" $electronPathFile
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare the pinned Electron test runtime.' }
          $electron = Get-Content -LiteralPath $electronPathFile -Raw
          ./scripts/check-windows-desktop-install.ps1 -Installer "$env:GITHUB_WORKSPACE/apps/desktop/out/installers/win32-x64/openbot-desktop-$version-win32-x64.exe" -PackagedDirectory "$env:GITHUB_WORKSPACE/apps/desktop/out/OpenBot-win32-x64" -Electron $electron -SmokeScript "$env:GITHUB_WORKSPACE/apps/desktop/scripts/windows-native-smoke.mjs" -EvidenceDirectory "$env:RUNNER_TEMP/openbot-windows-native-evidence"
      - name: Retain Windows cold-start evidence without fixture secrets
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-cold-start-${{ github.sha }}
          path: ${{ runner.temp }}/openbot-windows-native-evidence/summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Parse the Windows bootstrap with the native PowerShell parser
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/scripts/install-desktop.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw "Windows bootstrap contains PowerShell syntax errors." }
      - name: Retain versioned installers and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.OPENBOT_INSTALLER_ARTIFACT }}
          path: ${{ env.OPENBOT_INSTALLER_DIRECTORY }}
          if-no-files-found: error
          retention-days: 14
      - name: Validate macOS LaunchAgent contract with native plist parser
        if: runner.os == 'macOS'
        run: |
          npm run worker-host:macos:check
          npm run worker-host:macos:native-check
          /usr/bin/plutil -lint apps/worker-host-macos/Resources/com.openbot.worker-host.node.plist
          /usr/bin/plutil -lint apps/worker-host-macos/Resources/Info.plist.template
          /usr/bin/plutil -lint apps/worker-host-macos/Resources/OpenBotWorkerHost.entitlements.template.plist

      - name: Archive the unsigned Desktop bundle with executable modes and symlinks
        shell: bash
        run: |
          platform="$(node -p 'process.platform')"
          arch="$(node -p 'process.arch')"
          bundle="OpenBot-$platform-$arch"
          archive="openbot-desktop-$platform-$arch-${{ github.sha }}.tar.gz"
          tar -czf "apps/desktop/out/$archive" -C apps/desktop/out "$bundle"
          echo "OPENBOT_DESKTOP_ARCHIVE=apps/desktop/out/$archive" >> "$GITHUB_ENV"
      - name: Retain the unsigned Desktop development bundle for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.OPENBOT_DESKTOP_ARCHIVE }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  windows-worker-host:
    name: Windows Worker Host (build only)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/worker-host-windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/worker-host-windows/global.json
      - name: Record selected .NET SDK and runner information
        run: dotnet --info
      - name: Restore the reviewed package graph
        run: dotnet restore OpenBot.WorkerHost.Windows.ContractTests/OpenBot.WorkerHost.Windows.ContractTests.csproj --locked-mode
      - name: Build with warnings treated as errors
        run: dotnet build OpenBot.WorkerHost.Windows.ContractTests/OpenBot.WorkerHost.Windows.ContractTests.csproj --configuration Release --no-restore
      - name: Run host contract tests
        run: dotnet run --project OpenBot.WorkerHost.Windows.ContractTests/OpenBot.WorkerHost.Windows.ContractTests.csproj --configuration Release --no-build --no-restore
      - name: Publish the self-contained Windows x64 host
        run: dotnet publish OpenBot.WorkerHost.Windows/OpenBot.WorkerHost.Windows.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output "$env:RUNNER_TEMP\openbot-windows-host"
      - name: Inspect bounded publish inventory
        shell: pwsh
        run: ../../scripts/check-windows-worker-host-artifact.ps1 -PublishDirectory "$env:RUNNER_TEMP\openbot-windows-host"

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: openbot_test
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: openbot-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Verify contributor startup before shared packages have been built
        run: |
          node --input-type=module -e 'import postgres from "postgres"; const sql = postgres(process.env.OPENBOT_DATABASE_URL); try { await sql.unsafe("CREATE DATABASE openbot_dev_smoke"); } finally { await sql.end(); }'
          npm run dev:smoke
        env:
          OPENBOT_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_test
          OPENBOT_DEV_SMOKE_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_dev_smoke
      - run: npm run db:verify
        env:
          OPENBOT_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_test
      - name: Verify recurring-task transactions in a disposable PostgreSQL database
        run: |
          node --input-type=module -e 'import postgres from "postgres"; const sql = postgres(process.env.OPENBOT_DATABASE_URL); try { await sql.unsafe("CREATE DATABASE openbot_automation_test_ci"); } finally { await sql.end(); }'
          npm exec --workspace @openbot/server -- vitest run src/postgres-automation-store.integration.test.ts
        env:
          OPENBOT_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_test
          OPENBOT_AUTOMATION_TEST_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_automation_test_ci
      - name: Verify task attachment retention and invalid occurrences in a disposable PostgreSQL database
        run: |
          node --input-type=module -e 'import postgres from "postgres"; const sql = postgres(process.env.OPENBOT_DATABASE_URL); try { await sql.unsafe("CREATE DATABASE openbot_attachment_test_ci"); } finally { await sql.end(); }'
          npm exec --workspace @openbot/server -- vitest run src/task-attachment-references.integration.test.ts
        env:
          OPENBOT_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_test
          OPENBOT_ATTACHMENT_TEST_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_attachment_test_ci
      - name: Verify direct Bot conversations in a disposable PostgreSQL database
        run: |
          node --input-type=module -e 'import postgres from "postgres"; const sql = postgres(process.env.OPENBOT_DATABASE_URL); try { await sql.unsafe("CREATE DATABASE openbot_direct_test_ci"); } finally { await sql.end(); }'
          npm exec --workspace @openbot/server -- vitest run src/postgres-direct-conversations.integration.test.ts
        env:
          OPENBOT_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_test
          OPENBOT_DIRECT_TEST_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_direct_test_ci

      - name: Verify portable Bot instructions in a disposable PostgreSQL database
        run: |
          node --input-type=module -e 'import postgres from "postgres"; const sql = postgres(process.env.OPENBOT_DATABASE_URL); try { await sql.unsafe("CREATE DATABASE openbot_import_test_ci"); } finally { await sql.end(); }'
          npm exec --workspace @openbot/server -- vitest run src/employee-package.integration.test.ts
        env:
          OPENBOT_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_test
          OPENBOT_IMPORT_TEST_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_import_test_ci

      - name: Verify headless runtime and Bot collaboration in a disposable PostgreSQL database
        run: |
          node --input-type=module -e 'import postgres from "postgres"; const sql = postgres(process.env.OPENBOT_DATABASE_URL); try { await sql.unsafe("CREATE DATABASE openbot_collab_test_ci"); } finally { await sql.end(); }'
          npm exec --workspace @openbot/server -- vitest run src/agent-collaboration.integration.test.ts src/native-agent-headless.integration.test.ts --maxWorkers=1 --no-file-parallelism
        env:
          OPENBOT_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_test
          OPENBOT_COLLAB_TEST_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_collab_test_ci
      - name: Verify reactions and member removal in a disposable PostgreSQL database
        run: |
          node --input-type=module -e 'import postgres from "postgres"; const sql = postgres(process.env.OPENBOT_DATABASE_URL); try { await sql.unsafe("CREATE DATABASE openbot_interactions_test_ci"); } finally { await sql.end(); }'
          npm exec --workspace @openbot/server -- vitest run src/channel-interactions.integration.test.ts
        env:
          OPENBOT_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_test
          OPENBOT_INTERACTIONS_TEST_DATABASE_URL: postgres://openbot:openbot-ci-only@127.0.0.1:5432/openbot_interactions_test_ci

  server-container:
    name: Server container (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-24.04
            arch: amd64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Server Compose contract
        run: docker compose --file deploy/server/compose.yaml config --quiet
        env:
          OPENBOT_OWNER_PASSWORD: openbot-compose-ci-validation-only
      - name: Run Dockerfile build checks
        run: docker build --check --file deploy/server/Dockerfile .
      - name: Build the native Server image without publication
        run: docker build --platform "linux/${{ matrix.arch }}" --tag openbot-server:smoke --file deploy/server/Dockerfile .
      - name: Exercise production dependencies, PostgreSQL migrations, health, restart, and SIGTERM
        run: bash scripts/smoke-server-container.sh
        env:
          OPENBOT_TEST_IMAGE: openbot-server:smoke
          OPENBOT_TEST_PLATFORM: ${{ matrix.arch }}

      - name: Validate the Python Compose overlay
        run: docker compose --file deploy/server/compose.yaml --file deploy/server/compose.python.yaml config --quiet
        env:
          OPENBOT_OWNER_PASSWORD: openbot-compose-ci-validation-only
      - name: Build the optional Python Server image without publication
        run: docker build --platform "linux/${{ matrix.arch }}" --target runtime-python --tag openbot-server:python-smoke --file deploy/server/Dockerfile .
      - name: Exercise packaged Python loop, cancellation and Server lifecycle
        run: bash scripts/smoke-server-container.sh
        env:
          OPENBOT_TEST_IMAGE: openbot-server:python-smoke
          OPENBOT_TEST_PLATFORM: ${{ matrix.arch }}
          OPENBOT_TEST_AGENT_RUNTIME: python

      - name: Validate the Python product Compose and Dockerfile contracts
        timeout-minutes: 2
        run: |
          docker compose --file deploy/server/compose.product.yaml config --quiet
          docker build --check --file deploy/server/Dockerfile.product .
        env:
          OPENBOT_POSTGRES_PASSWORD: openbot-product-compose-ci-only
          OPENBOT_OWNER_PASSWORD: openbot-product-compose-owner-ci-only
      - name: Build the native Python product image without publication
        timeout-minutes: 12
        run: docker build --platform "linux/${{ matrix.arch }}" --target runtime-product --tag openbot-server:product-smoke --file deploy/server/Dockerfile.product .
      - name: Exercise Python product Owner HTTP, parsers, migrations and lifecycle
        timeout-minutes: 6
        shell: bash
        run: |
          umask 077
          python3 deploy/server/smoke-product.py --image openbot-server:product-smoke > "$RUNNER_TEMP/python-product-smoke.json"
          cat "$RUNNER_TEMP/python-product-smoke.json"
      - name: Retain the synthetic Python product smoke summary
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-product-smoke-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/python-product-smoke.json
          if-no-files-found: error
          retention-days: 7

  python-runtime:
    name: Python runtime and control reference (Linux amd64)
    runs-on: ubuntu-24.04
    # The adjacent-release gate includes the documented ten-minute History Shard warm-up.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
      - name: Verify browser qualification boundaries without starting a browser
        run: npm run test:browser:boundary
      - name: Verify Python and Server journeys in the isolated Linux fixture
        run: node scripts/test-runtime-linux.mjs
      - name: Select the reviewed npm version for control-plane parity
        run: npm install --global --ignore-scripts npm@10.9.9
      - name: Install existing TypeScript reference dependencies
        run: npm ci --ignore-scripts --audit=false
      - name: Compile the frozen test-only Server oracle
        run: npm run oracle:build
      - name: Bootstrap the isolated Python control reference
        run: apps/server-python/scripts/bootstrap.sh
        env:
          OPENBOT_CONTROL_PYTHON: python3.12
      - name: Bootstrap the separate SDK for persisted control integration
        run: apps/agent-runtime-python/scripts/bootstrap.sh
      - name: Verify Python control models and HTTP boundaries
        run: apps/server-python/scripts/check.sh -q
      - name: Bootstrap optional model and durable Worker qualification
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/openbot-work-reference"
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -m pip install \
            -r experiments/work-journey/requirements-model.txt -r apps/server-python/requirements-worker.txt
      - name: Compare Python and TypeScript against owned PostgreSQL
        run: npm run test:control:python
        env:
          OPENBOT_TEMPORAL_TEST_PYTHON: ${{ runner.temp }}/openbot-work-reference/bin/python
      - name: Qualify adjacent Temporal release recovery with PostgreSQL and mutual TLS
        shell: bash
        run: |
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B -m unittest discover -s experiments/linux-execution -p 'test_*.py' -q
          PYTHONPATH=apps/server-python/src:experiments/linux-execution "$RUNNER_TEMP/openbot-work-reference/bin/python" -B -m pytest -q experiments/linux-execution/protected_host_test.py experiments/linux-execution/protected_native_test.py
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B -m pytest -q apps/agent-runtime-python/tests/test_temporal_agent.py experiments/work-journey/test_product_deferred_workflow.py
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B -m unittest discover -s experiments/work-journey -p 'test_*.py' -v
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B experiments/work-journey/probe.py \
            --engine postgres-mtls --only-case concurrent-runs
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B experiments/work-journey/probe.py \
            --engine postgres-mtls --only-case model-receipt-recovery
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B experiments/work-journey/probe.py \
            --engine postgres-mtls --only-case product-model-recovery
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B experiments/work-journey/probe.py \
            --engine postgres-mtls --only-case product-publication-recovery
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B experiments/work-journey/probe.py \
            --engine postgres-mtls --only-case product-concurrent-runs
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B experiments/work-journey/probe.py \
            --engine postgres-mtls --only-case product-deferred-approval
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B experiments/work-journey/probe.py \
            --engine postgres-mtls --only-case product-closed-repair
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B experiments/work-journey/probe.py \
            --engine postgres-mtls --only-case product-owner-corrections
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --max-time 180 --max-filesize 93822307 \
            --output "$RUNNER_TEMP/temporal_1.31.3_linux_amd64.tar.gz" \
            https://github.com/temporalio/temporal/releases/download/v1.31.3/temporal_1.31.3_linux_amd64.tar.gz
          # The runner verifies pinned archive/member sizes and hashes before executing either binary.
          "$RUNNER_TEMP/openbot-work-reference/bin/python" -B experiments/work-journey/probe.py \
            --engine postgres-mtls --upgrade-archive "$RUNNER_TEMP/temporal_1.31.3_linux_amd64.tar.gz"

  # Keep this protected context pending until every platform and integration job finishes.
  check:
    if: always()
    needs: [security, validate, portable, windows-worker-host, database, server-container, python-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to succeed
        shell: bash
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          WINDOWS_WORKER_HOST_RESULT: ${{ needs.windows-worker-host.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          SERVER_CONTAINER_RESULT: ${{ needs.server-container.result }}
          PYTHON_RUNTIME_RESULT: ${{ needs.python-runtime.result }}
        run: |
          for result in "$SECURITY_RESULT" "$VALIDATE_RESULT" "$PORTABLE_RESULT" "$WINDOWS_WORKER_HOST_RESULT" "$DATABASE_RESULT" "$SERVER_CONTAINER_RESULT" "$PYTHON_RUNTIME_RESULT"; do
            if [[ "$result" != "success" ]]; then
              printf 'Every required CI job must succeed; observed result: %s\n' "$result" >&2
              exit 1
            fi
          done
