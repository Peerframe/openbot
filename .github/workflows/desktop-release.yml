name: Prepare Desktop release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main push CI run containing the selected installer artifacts
        required: true
        type: string
      version:
        description: Desktop version in that commit, for example 0.1.0-alpha.2
        required: true
        type: string
      targets:
        description: Exact installer platforms to verify and include
        required: true
        default: darwin-arm64,win32-x64
        type: choice
        options:
          - darwin-arm64,win32-x64
          - win32-x64
          - darwin-arm64,win32-x64,linux-x64

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_RUN_ID: ${{ inputs.run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TARGETS: ${{ inputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
      - name: Validate the source run before downloading any executable assets
        shell: bash
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RELEASE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import { validateDesktopReleaseRun } from "./scripts/prepare-desktop-release.ts";
            const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/source-run.json", "utf8"));
            const sha = validateDesktopReleaseRun(run, process.env.GH_REPO);
            fs.appendFileSync(process.env.GITHUB_ENV, "RELEASE_SOURCE_COMMIT=" + sha + "\n");
          '
      - name: Retrieve and verify the selected native installer set
        shell: bash
        run: |
          node --input-type=module -e '
            import { desktopReleaseTargets } from "./scripts/prepare-desktop-release.ts";
            desktopReleaseTargets(process.env.RELEASE_TARGETS.split(","));
          '
          IFS=',' read -r -a targets <<< "$RELEASE_TARGETS"
          for target in "${targets[@]}"; do
            name="openbot-installers-$target-$RELEASE_SOURCE_COMMIT"
            gh run download "$RELEASE_RUN_ID" --name "$name" --dir "$RUNNER_TEMP/downloads/$name"
          done
          node scripts/prepare-desktop-release.ts "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/release" "$RUNNER_TEMP/source-run.json" "$RELEASE_VERSION" "$GH_REPO" "--targets=$RELEASE_TARGETS"
      - name: Create a reviewable draft prerelease without replacing existing assets
        shell: bash
        run: |
          tag="desktop-v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo '::error::This Desktop release already exists; refusing to replace it.'
            exit 1
          fi
          if [[ "$RELEASE_TARGETS" == win32-x64 ]]; then
            platforms='Windows x64 only. This release contains no macOS or Linux installer.'
            install='Windows: open the EXE for a per-user installation.'
          elif [[ "$RELEASE_TARGETS" == darwin-arm64,win32-x64 ]]; then
            platforms='macOS arm64 and Windows x64 installers. macOS includes the local TS Server; Windows connects to a separately deployed Server. This release contains no Linux installer.'
            install='macOS: open the DMG and drag OpenBot into Applications. Windows: open the EXE for a per-user installation.'
          else
            platforms='macOS arm64, Windows x64 and Linux x64 installers. macOS includes the local TS Server; Windows and Linux connect to a separately deployed Server.'
            install='macOS: open the DMG and drag OpenBot into Applications. Windows: open the EXE for a per-user installation. Linux: install the DEB or run the AppImage.'
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          OpenBot Desktop $RELEASE_VERSION — unsigned development installers.

          Source: $RELEASE_SOURCE_COMMIT
          Verified CI: https://github.com/$GH_REPO/actions/runs/$RELEASE_RUN_ID

          $platforms

          Windows is a remote-service client. The linked Windows CI checks per-user NSIS installation, native DPAPI encrypted-profile restart across two Electron lifetimes, process identity, uninstall and fixture cleanup. Installing Desktop does not grant computer-control authority. Code signing and real-device conformance remain separate; no automatic updater is enabled.

          Install: $install Verify downloads against SHA256SUMS; desktop-manifest.json records the exact source and included targets. See docs/WINDOWS_DESKTOP.md in the source repository.
          EOF
          gh release create "$tag" "$RUNNER_TEMP/release/"* --target "$RELEASE_SOURCE_COMMIT" --title "OpenBot Desktop $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --draft --prerelease --latest=false
